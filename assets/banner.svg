<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="neonCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="neonPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b92b27"/><stop offset="100%" stop-color="#1565C0"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f5ff"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}}@keyframes rotateWire{0%{transform:rotate(0deg)}}@keyframes gentleFloat{0%{transform:translateY(0)}}.bg{fill:url(#bgGrad)}.grid-bg{fill:url(#grid)}.orb-1{animation:floatOrb1 12s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:floatOrb2 16s ease-in-out infinite alternate;transform-origin:1000px 300px}.mesh-wire{animation:rotateWire 35s linear infinite;transform-origin:1060px 120px}.data-pulse{animation:dash 8s linear infinite}.pill-card{transition:all .3s ease;animation:gentleFloat 6s ease-in-out infinite alternate}.pill-card:nth-child(2){animation-delay:1.5s}.pill-card:nth-child(3){animation-delay:3s}.pill-card:nth-child(4){animation-delay:4.5s}.main-title{font-size:46px;font-weight:900;letter-spacing:-.5px;fill:url(#textGrad);filter:drop-shadow(0 4px 12px rgba(0,245,255,.25))}.main-title,.pill-text,.subtitle,.tagline{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-size:20px;font-weight:500;fill:#e2e8f0;letter-spacing:.2px}.tagline{font-size:14px;font-weight:400;fill:#94a3b8}.pill-text{font-size:13px;font-weight:600;fill:#cbd5e1}</style><rect width="1200" height="420" class="bg" rx="16"/><rect width="1200" height="420" class="grid-bg" rx="16"/><g opacity=".35"><circle cx="200" cy="120" r="160" fill="#00f2fe" class="orb-1" filter="url(#glow)"/><circle cx="1020" cy="280" r="200" fill="#a855f7" class="orb-2" filter="url(#glow)"/><circle cx="620" cy="380" r="130" fill="#ec4899" filter="url(#glow)" opacity=".25"/></g><g fill="none" stroke="#38bdf8" stroke-width="1.2" class="mesh-wire" opacity=".22"><polygon points="1060 40 1130 80 1130 160 1060 200 990 160 990 80"/><polygon points="1060 40 1060 200 1130 80 990 160"/><polygon points="1060 40 1130 160 990 80 1060 200"/><line x1="990" x2="1130" y1="80" y2="160"/><line x1="1130" x2="990" y1="80" y2="160"/><circle cx="1060" cy="120" r="4" fill="#00f5ff"/></g><path fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" d="M 50 360 L 350 360 L 400 400 L 800 400 L 850 360 L 1150 360"/><path fill="none" stroke="#00f5ff" stroke-dasharray="12 40" stroke-width="2" d="M 50 360 L 350 360 L 400 400 L 800 400 L 850 360 L 1150 360" class="data-pulse"/><g><g transform="translate(70, 75) translate(0, 0)"><rect width="260" height="28" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="5" fill="#00f5ff"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="32" y="19" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text></g><text x="0" y="80" class="main-title" transform="translate(70, 75)">AI Game Asset Creation &amp; Skill Pipelines</text><text x="0" y="125" class="subtitle" transform="translate(70, 75)">Awesome List of Generative 3D, Auto-Rigging, PBR Texturing &amp; Autonomous Agent Skills</text><text x="0" y="158" class="tagline" transform="translate(70, 75)">Empowering game studios, technical artists, indie developers &amp; AI agents across Blender, Unreal, Unity &amp; Godot.</text><g><g class="pill-card" transform="translate(70, 75) translate(0, 195) translate(0, 0)"><rect width="245" height="42" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" rx="10"/><text x="18" y="26" class="pill-text">🧊 Text/Image-to-3D Meshes</text></g><g class="pill-card" transform="translate(70, 75) translate(0, 195) translate(260, 0)"><rect width="235" height="42" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" rx="10"/><text x="18" y="26" class="pill-text">⚡ Agentic Skills (SKILL.md)</text></g><g class="pill-card" transform="translate(70, 75) translate(0, 195) translate(510, 0)"><rect width="250" height="42" fill="url(#cardGrad)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.2" rx="10"/><text x="18" y="26" class="pill-text">🦴 Auto-Rigging &amp; Animation</text></g><g class="pill-card" transform="translate(70, 75) translate(0, 195) translate(775, 0)"><rect width="265" height="42" fill="url(#cardGrad)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1.2" rx="10"/><text x="18" y="26" class="pill-text">🎮 Blender • Godot • Unity • Unreal</text></g></g></g></svg>